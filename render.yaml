services:
  - type: web
    name: smart-manage-backend
    runtime: node
    plan: starter
    buildCommand: npm ci
    startCommand: npm run start
    healthCheckPath: /api/version
    envVars:
      - key: NODE_ENV
        value: production
      - key: SKIP_NEXT_APP
        value: "true"
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: REDIS_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
