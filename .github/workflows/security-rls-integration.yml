name: Security RLS Integration

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'server/db/migrations/**'
      - 'test/security-rls-postgres.integration.js'
      - 'src/lib/supabase.ts'
      - '.github/workflows/security-rls-integration.yml'

permissions:
  contents: read

jobs:
  security-rls-postgres:
    name: security-rls-postgres
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: smart_manage_security_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: security-ci-local-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_manage_security_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:security-ci-local-only@127.0.0.1:5432/smart_manage_security_test
      SMART_MANAGE_SECURITY_INTEGRATION: '1'
      DATABASE_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Prepare audited schema fixture and initial grants
        run: node scripts/security-schema-fixture.cjs
      - name: Apply isolated migration chain
        run: npm run db:migrate
      - name: Grant isolated backend role after migrations
        run: node scripts/security-schema-fixture.cjs --after-migrations
      - name: Run real PostgreSQL role checks
        run: node --test test/security-rls-postgres.integration.js
