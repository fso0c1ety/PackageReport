name: Row visibility PostgreSQL benchmark
on: [pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: visibility_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: synthetic-only
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:synthetic-only@127.0.0.1:5432/visibility_test
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/tasks-read-performance.test.js test/permissions.test.js test/enterprise-permissions.test.js
      - run: node scripts/benchmark-row-visibility.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: row-visibility-plans-and-results
          path: artifacts/row-visibility
          if-no-files-found: error
