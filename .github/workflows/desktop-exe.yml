name: Build Windows Desktop EXE

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "server/**"
      - "scripts/**"
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/desktop-exe.yml"
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "server/**"
      - "scripts/**"
      - "electron/**"
      - "package.json"
      - "package-lock.json"
      - "next.config.ts"
      - ".github/workflows/desktop-exe.yml"

jobs:
  build-windows-exe:
    name: Build Windows EXE
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop installer
        run: npm run desktop:build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_FRONTEND_URL: ${{ secrets.NEXT_PUBLIC_FRONTEND_URL }}
          NEXT_PUBLIC_ASSET_URL: ${{ secrets.NEXT_PUBLIC_ASSET_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Verify packaged version and official update source
        shell: pwsh
        run: |
          $package = Get-Content package.json | ConvertFrom-Json
          $app = Get-Item "dist-electron/win-unpacked/Smart Manage.exe"
          if (-not $app) { throw "Packaged Smart Manage executable is missing." }
          if (-not $app.VersionInfo.ProductVersion.StartsWith($package.version)) {
            throw "Packaged version $($app.VersionInfo.ProductVersion) does not match $($package.version)."
          }

          $updateConfig = "dist-electron/win-unpacked/resources/app-update.yml"
          if (-not (Test-Path $updateConfig)) { throw "Packaged updater metadata is missing." }
          $updateText = Get-Content $updateConfig -Raw
          if ($updateText -notmatch "provider:\s*github" -or $updateText -notmatch "owner:\s*fso0c1ety" -or $updateText -notmatch "repo:\s*PackageReport") {
            throw "Packaged updater is not restricted to the official GitHub repository."
          }
          if ($updateText -match "(?i)(token|password|secret)\s*:") {
            throw "Updater metadata contains a forbidden secret field."
          }

      - name: Smoke test packaged application startup
        shell: pwsh
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_FRONTEND_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SOCKET_URL: http://127.0.0.1:3000
        run: |
          $ErrorActionPreference='Stop'
          foreach($program in (Get-ChildItem 'dist-electron/win-unpacked' -Recurse -Filter '*.exe')){
            $addresses=@('0.0.0.1-126.255.255.255','128.0.0.0-255.255.255.254','::2-ffff:ffff:ffff:ffff:ffff:ffff:ffff:fffe')
            $rule=New-NetFirewallRule -DisplayName "SmartManage packaging smoke $([guid]::NewGuid())" -Direction Outbound -Program $program.FullName -Action Block -RemoteAddress $addresses -ErrorAction Stop
            if($rule.Enabled -ne 'True' -or $rule.Action -ne 'Block'){throw 'Packaged startup isolation inactive'}
          }
          $process = Start-Process -FilePath "dist-electron/win-unpacked/Smart Manage.exe" -PassThru -WindowStyle Hidden
          Start-Sleep -Seconds 25
          $process.Refresh()
          if ($process.HasExited) { throw "Packaged Smart Manage exited during startup with code $($process.ExitCode)." }
          Stop-Process -Id $process.Id -Force

      - name: Install and verify candidate on disposable runner
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem dist-electron -Filter '*Setup*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer missing' }
          $destination = Join-Path $env:RUNNER_TEMP 'smartmanage-install-acceptance'
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @('/S',"/D=$destination") -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw "Installer failed: $($install.ExitCode)" }
          $exe = Join-Path $destination 'Smart Manage.exe'
          $expected = (Get-Content package.json | ConvertFrom-Json).version
          if (-not (Get-Item $exe).VersionInfo.ProductVersion.StartsWith($expected)) { throw 'Installed version mismatch' }
          $update = Get-Content (Join-Path $destination 'resources/app-update.yml') -Raw
          if ($update -notmatch 'owner: fso0c1ety' -or $update -notmatch 'repo: PackageReport') { throw 'Installed updater source mismatch' }
          # No installed app launch against an unverified backend. The separate
          # packaged startup check above is not authenticated acceptance.
          New-Item -ItemType Directory -Force artifacts/installation | Out-Null
          @{installed=$true;version=$expected;installerSha256=(Get-FileHash $installer.FullName -Algorithm SHA256).Hash;installedLogin='NOT RUN: isolated backend required';upgrade='NOT RUN: candidate is same version as stable';rollback='NOT RUN'} | ConvertTo-Json | Set-Content artifacts/installation/windows.json
          Get-ChildItem dist-electron -File | Where-Object Extension -in '.exe','.yml','.blockmap' | Get-FileHash -Algorithm SHA256 | Select-Object Hash,Path | ConvertTo-Json | Set-Content artifacts/installation/checksums.json

      - name: Upload installation evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-installation-evidence
          path: artifacts/installation
          if-no-files-found: error

      - name: Upload desktop artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PackageReport-windows-exe
          path: |
            dist-electron/*.exe
            dist-electron/*.yml
            dist-electron/*.blockmap
          if-no-files-found: error
          retention-days: 7
