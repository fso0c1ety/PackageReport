name: PostgreSQL Migration Integration

on:
  pull_request:
    branches: [main]
    paths:
      - "server/db/**"
      - "test/migration-002-postgres.integration.js"
      - ".github/workflows/migration-postgres.yml"
  workflow_dispatch:

jobs:
  migration-002:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: smart_manage_test
          POSTGRES_PASSWORD: smart_manage_test
          POSTGRES_DB: smart_manage_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U smart_manage_test -d smart_manage_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run isolated PostgreSQL migration integration test
        env:
          DATABASE_URL: postgresql://smart_manage_test:smart_manage_test@localhost:5432/smart_manage_test
          SMART_MANAGE_POSTGRES_INTEGRATION: "1"
        run: node --test test/migration-002-postgres.integration.js
