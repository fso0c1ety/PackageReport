name: EGRESS-4 Notification Benchmark
on:
  pull_request:
    paths:
      - 'src/app/api/notifications/route.js'
      - 'scripts/seed-egress4-benchmark.mjs'
      - 'scripts/benchmark-egress4-notifications.mjs'
      - 'scripts/egress4-pg-counter.cjs'
      - '.github/workflows/egress-4-benchmark.yml'
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            ref: d2117b0c8ec5c2f1561311565b3143eb5a8aa7a8
          - name: head
            ref: ${{ github.event.pull_request.head.sha }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: smart_manage_portal_acceptance, POSTGRES_USER: postgres, POSTGRES_PASSWORD: portal-ci-local-only }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_manage_portal_acceptance"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:portal-ci-local-only@127.0.0.1:5432/smart_manage_portal_acceptance
      DATABASE_SSL: 'false'
      E2E_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3000
      EGRESS4_PASSWORD: Egress4CiTemporary1!
      JWT_SECRET: Egress4CiTemporary1!
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Configure disposable migrations
        run: echo "MIGRATION_TARGET=000_legacy_base_schema.sql,001_core_saas_schema.sql,003_legacy_automation_and_table_defaults.sql,004_automation_conditional_rules.sql,004_password_reset_tokens.sql,005_billing_subscriptions.sql,006_table_doc_content.sql,007_direct_messages.sql,008_enable_rows_realtime.sql,009_extended_user_profiles.sql,010_universal_board_engine.sql,011_automation_builder.sql,012_ai_assistant.sql,016_performance_indexes.sql,018_driver_profile_fields.sql,019_logistics_driver_portal.sql,020_account_security.sql,021_tenant_file_security.sql,022_universal_roles_and_portals.sql,023_template_portal_presets.sql,027_demo_requests_and_demo_workspaces.sql,028_demo_provisioning_flow.sql,029_repair_demo_board_access_guard.sql,031_notification_delivery_idempotency.sql,034_notification_preferences.sql,035_calendar_events_baseline.sql" >> "$GITHUB_ENV"
      - run: npm run db:migrate
      - run: node scripts/seed-egress4-benchmark.mjs
      - name: Checkout measured ref
        run: git checkout "${{ matrix.ref }}" && git show "${{ github.event.pull_request.head.sha }}:scripts/benchmark-egress4-notifications.mjs" > scripts/.benchmark-egress4-notifications.mjs && git show "${{ github.event.pull_request.head.sha }}:scripts/egress4-pg-counter.cjs" > scripts/.egress4-pg-counter.cjs
      - run: npm run build
      - name: Start server
        run: |
          : > /tmp/egress4-pg-queries.ndjson
          nohup env NODE_OPTIONS="--require=$PWD/scripts/.egress4-pg-counter.cjs" EGRESS4_QUERY_FILE=/tmp/egress4-pg-queries.ndjson npx next start -p 3000 -H 127.0.0.1 >/tmp/egress4-server.log 2>&1 &
          for attempt in $(seq 1 60); do curl --silent --fail http://127.0.0.1:3000/login/ >/dev/null && break || sleep 2; done
      - run: node scripts/.benchmark-egress4-notifications.mjs > egress4-${{ matrix.name }}.json
      - uses: actions/upload-artifact@v4
        with: { name: egress4-${{ matrix.name }}, path: egress4-${{ matrix.name }}.json }
