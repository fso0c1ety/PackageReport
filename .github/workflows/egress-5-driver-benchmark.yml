name: EGRESS-5 Driver Payload Benchmark

on:
  push:
    branches:
      - incident/payload-egress-cleanup
  pull_request:
    paths:
      - 'src/app/api/logistics/driver/documents/route.js'
      - 'scripts/benchmark-egress5-driver.mjs'
      - 'scripts/egress5-pg-payload.cjs'
      - '.github/workflows/egress-5-driver-benchmark.yml'

jobs:
  benchmark:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: base
            ref: b48f49219ccf1ac46c118082a4c2772193d265ef
          - name: head
            ref: ${{ github.sha }}
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_manage_portal_acceptance
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: portal-ci-local-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_manage_portal_acceptance"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:portal-ci-local-only@127.0.0.1:5432/smart_manage_portal_acceptance
      DATABASE_SSL: 'false'
      E2E_BASE_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_API_URL: http://127.0.0.1:3000
      EGRESS5_PASSWORD: Egress5CiOnlyPasswordA1!
      JWT_SECRET: Egress5CiOnlyPasswordA1!
      EGRESS5_QUERY_FILE: /tmp/egress5-pg-payload.ndjson
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Preserve benchmark harness
        run: |
          cp scripts/benchmark-egress5-driver.mjs /tmp/benchmark-egress5-driver.mjs
          cp scripts/install-egress5-db-probe.mjs /tmp/install-egress5-db-probe.mjs
      - name: Configure disposable migrations
        shell: bash
        run: echo "MIGRATION_TARGET=000_legacy_base_schema.sql,001_core_saas_schema.sql,003_legacy_automation_and_table_defaults.sql,005_billing_subscriptions.sql,008_enable_rows_realtime.sql,009_extended_user_profiles.sql,010_universal_board_engine.sql,018_driver_profile_fields.sql,019_logistics_driver_portal.sql,020_account_security.sql,021_tenant_file_security.sql,022_universal_roles_and_portals.sql,031_notification_delivery_idempotency.sql,033_professional_invitations.sql,034_notification_preferences.sql,035_calendar_events_baseline.sql" >> "$GITHUB_ENV"
      - run: npm run db:migrate
      - name: Checkout measured ref
        shell: bash
        run: |
          git checkout "${{ matrix.ref }}"
          cp /tmp/benchmark-egress5-driver.mjs scripts/.benchmark-egress5-driver.mjs
          cp /tmp/install-egress5-db-probe.mjs scripts/.install-egress5-db-probe.mjs
          node scripts/.install-egress5-db-probe.mjs
      - run: npm run build
      - name: Start application
        shell: bash
        run: |
          : > "$EGRESS5_QUERY_FILE"
          nohup env EGRESS5_DB_PROBE=1 EGRESS5_QUERY_FILE=/tmp/egress5-pg-payload.ndjson npx next start -p 3000 -H 127.0.0.1 >/tmp/egress5-server.log 2>&1 &
          for attempt in $(seq 1 60); do curl --silent --fail http://127.0.0.1:3000/login/ >/dev/null && break || sleep 2; done
      - name: Run benchmark
        run: node scripts/.benchmark-egress5-driver.mjs > egress5-${{ matrix.name }}.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: egress5-driver-${{ matrix.name }}
          path: |
            egress5-${{ matrix.name }}.json
            /tmp/egress5-server.log
            /tmp/egress5-pg-payload.ndjson
          if-no-files-found: ignore
