name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Build Next.js App
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_FRONTEND_URL: ${{ secrets.NEXT_PUBLIC_FRONTEND_URL }}
          NEXT_PUBLIC_ASSET_URL: ${{ secrets.NEXT_PUBLIC_ASSET_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_DEFAULT_KEY }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Build APK with Gradle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Verify Android identity and canonical version
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          AAPT="$(find "$ANDROID_SDK_ROOT/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -x "$AAPT"
          BADGING="$($AAPT dump badging "$APK" | head -n 1)"
          VERSION_NAME="$(node -p "require('./package.json').version")"
          VERSION_CODE="$(node -p "require('./package.json').smartManage.androidVersionCode")"
          echo "$BADGING" | grep -F "name='com.smartmanage.app'"
          echo "$BADGING" | grep -F "versionName='$VERSION_NAME'"
          echo "$BADGING" | grep -F "versionCode='$VERSION_CODE'"

          if grep -R -E "REQUEST_INSTALL_PACKAGES|application/vnd\.android\.package-archive" android/app/src/main src/app/SmartManageUpdate.tsx; then
            echo "Arbitrary APK installation behavior is forbidden."
            exit 1
          fi

      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install APK in isolated emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: |
            adb install -r android/app/build/outputs/apk/debug/app-debug.apk
            adb shell pm path com.smartmanage.app
            mkdir -p artifacts/android-installation
            adb shell dumpsys package com.smartmanage.app > artifacts/android-installation/package.txt
            sha256sum android/app/build/outputs/apk/debug/app-debug.apk > artifacts/android-installation/apk.sha256
            echo 'EMULATOR INSTALL VERIFIED; launch/login/tasks/reconnect/notifications NOT RUN pending isolated backend configuration; physical device NOT TESTED; debug signed APK only' > artifacts/android-installation/scope.txt
      - name: Upload emulator evidence
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-emulator-installation-evidence
          path: artifacts/android-installation
          if-no-files-found: error
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-debug.apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
