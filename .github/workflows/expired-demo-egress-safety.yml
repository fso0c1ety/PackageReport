name: Expired Demo Egress Safety (isolated)

on:
  push:
    branches: [test/expired-demo-egress-safety]
    paths:
      - 'src/app/api/_lib/billing.js'
      - 'src/app/api/workspaces/**'
      - 'scripts/benchmark-expired-demo-egress.mjs'
      - 'scripts/integration/expired-demo-http.mjs'
      - '.github/workflows/expired-demo-egress-safety.yml'
  workflow_dispatch:

jobs:
  benchmark:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env: { POSTGRES_DB: smart_manage_egress_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: egress-ci-local-only }
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_manage_egress_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:egress-ci-local-only@127.0.0.1:5432/smart_manage_egress_test
      DATABASE_SSL: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Generate CI-only JWT secret
        shell: bash
        run: echo "JWT_SECRET=$(openssl rand -hex 32)" >> "$GITHUB_ENV"
      - name: Apply isolated schema
        shell: bash
        run: |
          targets="$(find server/db/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | paste -sd, -)"
          MIGRATION_TARGET="$targets" npm run db:migrate
      - name: Preserve benchmark harness
        run: cp scripts/benchmark-expired-demo-egress.mjs /tmp/benchmark-expired-demo-egress.mjs
      - name: Preserve HTTP harness
        run: cp scripts/integration/expired-demo-http.mjs /tmp/expired-demo-http.mjs
      - name: Verify immutable BASE and HEAD objects
        shell: bash
        run: |
          git cat-file -e ec20c4e3a4aeb7dc772e4bb132f48e4796f00b04^{commit}
          git cat-file -e f83acd02de5c9ddc2f3a9f63fb8de9482de0af5d^{commit}
          rm -rf artifacts
      - name: Run real BASE and HEAD safety measurements
        shell: bash
        run: |
          mkdir -p artifacts
          for pair in BASE:ec20c4e3a4aeb7dc772e4bb132f48e4796f00b04 HEAD:f83acd02de5c9ddc2f3a9f63fb8de9482de0af5d; do
            variant="${pair%%:*}"; sha="${pair##*:}"
            git checkout --detach "$sha"
            cp /tmp/benchmark-expired-demo-egress.mjs scripts/benchmark-expired-demo-egress.mjs
            export MIGRATION_TARGET="$(find server/db/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | paste -sd, -)"
            npm run db:migrate
            BENCHMARK_VARIANT="$variant" OUTPUT_JSON="artifacts/$variant.json" node scripts/benchmark-expired-demo-egress.mjs
          done
          test -s artifacts/BASE.json && test -s artifacts/HEAD.json
          node -e "const fs=require('fs');const b=JSON.parse(fs.readFileSync('artifacts/BASE.json'));const h=JSON.parse(fs.readFileSync('artifacts/HEAD.json'));fs.writeFileSync('artifacts/COMPARISON.md','# Expired demo billing safety\n\nThis is an isolated SQL-level harness over the real checked-out revisions. It does not claim authenticated HTTP execution: HTTP requests/response bytes, WAL bytes and route p50/p95 are UNKNOWN until the application E2E harness is added.\n\n- BASE billing outcome/update rows: '+b.billingStatus[0].outcome+'/'+b.billingStatus[0].updateRows+'\n- HEAD billing outcome/update rows: '+h.billingStatus[0].outcome+'/'+h.billingStatus[0].updateRows+'\n- BASE no-op rows: '+b.noOpUpdateRows+'\n- HEAD no-op rows: '+h.noOpUpdateRows+'\n- HEAD demo unchanged: '+h.demoUnchanged+'\n- HEAD normal workspace cleared: '+h.normalCleared+'\n- BASE delete metrics: '+JSON.stringify(b.workspaceDelete)+'\n- HEAD delete metrics: '+JSON.stringify(h.workspaceDelete)+'\n')"
      - name: Run real HTTP integration on each revision
        shell: bash
        run: |
          for pair in BASE:ec20c4e3a4aeb7dc772e4bb132f48e4796f00b04 HEAD:f83acd02de5c9ddc2f3a9f63fb8de9482de0af5d; do
            variant="${pair%%:*}"; sha="${pair##*:}"
            git checkout --detach "$sha"
            mkdir -p scripts/integration
            cp /tmp/expired-demo-http.mjs scripts/integration/expired-demo-http.mjs
            export MIGRATION_TARGET="$(find server/db/migrations -maxdepth 1 -type f -name '*.sql' -printf '%f\n' | sort | paste -sd, -)"
            npm run db:migrate
            BENCHMARK_VARIANT="$variant" OUTPUT_JSON="artifacts/http-$variant.json" SERVER_LOG="artifacts/server-$variant.log" node scripts/integration/expired-demo-http.mjs
          done
      - name: Require HTTP artifacts
        run: test -s artifacts/http-BASE.json && test -s artifacts/http-HEAD.json
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: expired-demo-egress-safety, path: artifacts/ }
