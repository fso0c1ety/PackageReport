name: Release Smart Manage for Windows

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing test tag to package (for example v1.0.1-test.1)"
        required: true
        type: string
      prerelease:
        description: "Publish as prerelease (required for manual test runs)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: false
    steps:
      - name: Validate release channel
        shell: pwsh
        run: |
          if ("${{ github.event_name }}" -eq "workflow_dispatch" -and "${{ inputs.prerelease }}" -ne "true") {
            throw "Manual update-system runs must remain prereleases. Stable releases are tag-triggered only."
          }

      - name: Checkout exact release commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Validate release tag and package version
        shell: pwsh
        run: |
          $tag = if ("${{ github.event_name }}" -eq "workflow_dispatch") { "${{ inputs.tag }}" } else { "${{ github.ref_name }}" }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($tag -notmatch "^v$([regex]::Escape($version))([-.].+)?$") {
            throw "Release tag $tag does not match package version $version."
          }

      - name: Run release validation
        run: |
          npm run typecheck
          npm run lint
          npm test

      - name: Build signed-ready NSIS package
        run: npm run desktop:build
        env:
          NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL }}
          NEXT_PUBLIC_FRONTEND_URL: ${{ secrets.NEXT_PUBLIC_FRONTEND_URL }}
          NEXT_PUBLIC_ASSET_URL: ${{ secrets.NEXT_PUBLIC_ASSET_URL }}
          NEXT_PUBLIC_SOCKET_URL: ${{ secrets.NEXT_PUBLIC_SOCKET_URL }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}

      - name: Create stable-name distribution and checksum
        shell: pwsh
        run: |
          $files = Get-ChildItem dist-electron -File | Where-Object { $_.Extension -in '.exe','.yml','.blockmap' }
          if (-not ($files | Where-Object Name -eq 'latest.yml')) { throw 'electron-builder update metadata latest.yml is missing.' }
          Compress-Archive -Path $files.FullName -DestinationPath Smart.Manage.zip -Force
          (Get-FileHash Smart.Manage.zip -Algorithm SHA256).Hash.ToLower() + '  Smart.Manage.zip' | Set-Content Smart.Manage.zip.sha256

      - name: Publish GitHub Release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          prerelease: ${{ github.event_name == 'workflow_dispatch' && inputs.prerelease || false }}
          generate_release_notes: true
          files: |
            Smart.Manage.zip
            Smart.Manage.zip.sha256
            dist-electron/*.exe
            dist-electron/*.yml
            dist-electron/*.blockmap
