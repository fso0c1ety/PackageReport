name: Scheduler PostgreSQL timezone
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  timezone:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: scheduler_test
        ports: ["5432:5432"]
        options: --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Execute isolated SQL assertions
        env:
          PGPASSWORD: isolated-test-only
        run: psql -h 127.0.0.1 -U postgres -d scheduler_test -f test/scheduler-timezone.sql
