name: Egress Phase 2 Measurement

on:
  workflow_dispatch:
  workflow_call:
  pull_request:
    paths:
      - 'scripts/benchmark-egress-phase2.mjs'
      - '.github/workflows/egress-phase2-measurement.yml'
      - 'scripts/benchmark-egress2.mjs'

permissions:
  contents: read

jobs:
  measure-isolated:
    name: isolated numeric egress measurement
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_manage_egress_phase2
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: phase2-local-only
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_manage_egress_phase2"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      DATABASE_URL: postgresql://postgres:phase2-local-only@127.0.0.1:5432/smart_manage_egress_phase2
      DATABASE_SSL: 'false'
      E2E_BASE_URL: http://127.0.0.1:3000
      EGRESS2_PASSWORD: Egress2Phase2LocalOnlyA1!
      EGRESS_MEASURE_PASSWORD: EgressPhase2LocalOnlyA1!
      JWT_SECRET: Egress2Phase2LocalOnlyA1!
      CI: 'true'
      PORTAL_ACCEPTANCE_CI: '1'
      SMART_MANAGE_PORTAL_TEST_PASSWORD: EgressPhase2LocalOnlyA1!
      SMART_MANAGE_DEMO_PASSWORD: EgressPhase2LocalOnlyA1!
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install Chromium for real Playwright measurement
        run: npx playwright install --with-deps chromium
      - name: Enable pg_stat_statements before migrations
        shell: bash
        run: |
          container="$(docker ps --filter ancestor=postgres:16 --format '{{.ID}}' | head -n 1)"
          test -n "$container"
          docker exec "$container" psql -U postgres -d smart_manage_egress_phase2 -c "ALTER SYSTEM SET shared_preload_libraries = 'pg_stat_statements'"
          docker restart "$container"
          for attempt in $(seq 1 30); do
            PGPASSWORD=phase2-local-only pg_isready -h 127.0.0.1 -p 5432 -U postgres -d smart_manage_egress_phase2 && break
            sleep 2
          done
      - name: Prepare isolated schema
        run: |
          npm run db:migrate
      - name: Enable local pg_stat_statements when available
        shell: bash
        run: |
          PGPASSWORD=phase2-local-only psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c 'CREATE EXTENSION IF NOT EXISTS pg_stat_statements'
          test "$(PGPASSWORD=phase2-local-only psql "$DATABASE_URL" -Atc "SELECT count(*) FROM pg_available_extensions WHERE name='pg_stat_statements'")" = "1"
      - name: Build and start isolated app
        shell: bash
        run: |
          npm run build
          nohup npx next start -p 3000 -H 127.0.0.1 >/tmp/egress-phase2-next.log 2>&1 &
          for attempt in $(seq 1 60); do curl --silent --fail http://127.0.0.1:3000/login/ >/dev/null && exit 0; sleep 2; done
          cat /tmp/egress-phase2-next.log
          exit 1
      - name: Measure existing EGRESS-2 scenarios
        shell: bash
        run: |
          mkdir -p artifacts/egress-phase2/raw
          for scenario in initial pagination idle; do
            EGRESS2_SCENARIO="$scenario" node scripts/benchmark-egress2.mjs >"artifacts/egress-phase2/raw/egress2-$scenario.json"
          done
      - name: Seed two isolated synthetic tenants
        run: node scripts/seed-egress-phase2-tenants.mjs
      - name: Run Playwright application measurements
        run: node scripts/measure-egress-playwright.mjs
        env:
          EGRESS_MEASURE_PASSWORD: EgressPhase2LocalOnlyA1!
          EGRESS_IDLE_SECONDS: 5,15,30
      - name: Run real Kanban UI pagination measurements
        run: npx playwright test e2e/kanban-pagination.spec.ts --project=desktop-1440 --workers=1
        env:
          SMART_MANAGE_PORTAL_TEST_PASSWORD: EgressPhase2LocalOnlyA1!
          KANBAN_E2E_ISOLATED: '1'
      - name: Cleanup synthetic tenants
        if: always()
        run: node scripts/cleanup-egress-phase2-tenants.mjs
      - name: Aggregate measured CSV and JSON
        run: node scripts/benchmark-egress-phase2.mjs
      - name: Require numeric measurement artifacts
        shell: bash
        run: |
          required=(
            artifacts/egress-phase2/playwright/PLAYWRIGHT_EGRESS_RESULTS.json
            artifacts/egress-phase2/DB_QUERY_DELTAS.csv
            artifacts/egress-phase2/TOP20_NETWORK_CONSUMERS.csv
            artifacts/egress-phase2/TENANT_USAGE_MEASUREMENTS.csv
          )
          for file in "${required[@]}"; do
            test -s "$file" || { echo "Missing required measurement artifact: $file" >&2; exit 1; }
          done
      - name: Upload isolated measurements
        uses: actions/upload-artifact@v4
        with:
          name: egress-phase2-measurements-${{ github.sha }}
          path: artifacts/egress-phase2
          if-no-files-found: error
