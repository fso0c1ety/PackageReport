name: Required check orchestrator

on:
  push:
    branches: [feat/required-check-gates-orchestrated]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read
  deployments: read

jobs:
  policy:
    name: policy-detector
    runs-on: ubuntu-latest
    outputs:
      heavy: ${{ steps.detect.outputs.heavy }}
    steps:
      - uses: actions/checkout@v4
      - id: detect
        uses: actions/github-script@v7
        with:
          script: |
            const {detect} = require('./scripts/required-check-detector.cjs');
            const event = context.payload;
            const base = event.pull_request?.base.sha || event.before;
            const head = event.pull_request?.head.sha || event.after || context.sha;
            if (!/^[a-f0-9]{40}$/.test(base || '') || !/^[a-f0-9]{40}$/.test(head || '')) core.setFailed('BLOCKED: base/head SHA missing');
            else {
              const files = [];
              for (let page = 1; page <= 20; page++) {
                const response = await github.request('GET /repos/{owner}/{repo}/compare/{base}...{head}', {owner: context.repo.owner, repo: context.repo.repo, base, head, page, per_page: 100});
                if (!Array.isArray(response.data.files)) throw new Error('BLOCKED: complete file diff unavailable');
                files.push(...response.data.files);
                if (response.data.files.length < 100) break;
                if (page === 20) throw new Error('BLOCKED: diff exceeded safe pagination limit');
              }
              const result = detect({base, head, files});
              core.setOutput('heavy', String(result.heavy));
            }

  suite-test:
    needs: policy
    if: ${{ always() && needs.policy.result == 'success' }}
    uses: ./.github/workflows/quality.yml

  suite-portal-acceptance:
    needs: policy
    if: ${{ always() && needs.policy.result == 'success' && needs.policy.outputs.heavy == 'true' }}
    uses: ./.github/workflows/portal-acceptance.yml

  suite-kanban-postgres-e2e:
    needs: policy
    if: ${{ always() && needs.policy.result == 'success' && needs.policy.outputs.heavy == 'true' }}
    uses: ./.github/workflows/kanban-postgres-e2e.yml

  suite-clean-install:
    needs: policy
    if: ${{ always() && needs.policy.result == 'success' && needs.policy.outputs.heavy == 'true' }}
    uses: ./.github/workflows/migration-clean-install.yml

  suite-local-safety:
    needs: policy
    if: ${{ always() && needs.policy.result == 'success' && needs.policy.outputs.heavy == 'true' }}
    uses: ./.github/workflows/deployment-safety-validation.yml

  suite-benchmark:
    needs: policy
    if: ${{ always() && needs.policy.result == 'success' && needs.policy.outputs.heavy == 'true' }}
    uses: ./.github/workflows/egress-2-benchmark.yml

  test:
    name: test
    needs: [policy, suite-test]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: if [ "${{ needs.policy.result }}" != success ] || [ "${{ needs.suite-test.result }}" != success ]; then exit 1; fi

  portal-acceptance:
    name: portal-acceptance
    needs: [policy, suite-portal-acceptance]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.policy.result }}" != success ]; then exit 1; fi
          if [ "${{ needs.policy.outputs.heavy }}" = true ] && [ "${{ needs.suite-portal-acceptance.result }}" != success ]; then exit 1; fi

  kanban-postgres-e2e:
    name: kanban-postgres-e2e
    needs: [policy, suite-kanban-postgres-e2e]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.policy.result }}" != success ]; then exit 1; fi
          if [ "${{ needs.policy.outputs.heavy }}" = true ] && [ "${{ needs.suite-kanban-postgres-e2e.result }}" != success ]; then exit 1; fi

  clean-install:
    name: clean-install
    needs: [policy, suite-clean-install]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.policy.result }}" != success ]; then exit 1; fi
          if [ "${{ needs.policy.outputs.heavy }}" = true ] && [ "${{ needs.suite-clean-install.result }}" != success ]; then exit 1; fi

  local-safety:
    name: local-safety
    needs: [policy, suite-local-safety]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.policy.result }}" != success ]; then exit 1; fi
          if [ "${{ needs.policy.outputs.heavy }}" = true ] && [ "${{ needs.suite-local-safety.result }}" != success ]; then exit 1; fi

  benchmark:
    name: benchmark
    needs: [policy, suite-benchmark]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ needs.policy.result }}" != success ]; then exit 1; fi
          if [ "${{ needs.policy.outputs.heavy }}" = true ] && [ "${{ needs.suite-benchmark.result }}" != success ]; then exit 1; fi
