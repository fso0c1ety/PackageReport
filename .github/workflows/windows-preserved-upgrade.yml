name: Preserved Windows installer upgrade and rollback
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-preserved-upgrade.yml'
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          name: PackageReport-windows-exe
          run-id: 42045849602
          github-token: ${{ github.token }}
          path: candidate/dist-electron
      - name: Install stable, upgrade preserved binary, and restore stable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_PUBLIC_FRONTEND_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_API_URL: http://127.0.0.1:3000
          NEXT_PUBLIC_SOCKET_URL: http://127.0.0.1:3000
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download v1.0.31 --repo fso0c1ety/PackageReport --pattern Smart-Manage-Setup-1.0.31.exe --dir stable
          if ($LASTEXITCODE -ne 0) { throw 'Official stable download failed' }
          $candidate = (Resolve-Path candidate/dist-electron/Smart-Manage-Setup-1.0.32.exe).Path
          if ((Get-FileHash $candidate -Algorithm SHA256).Hash -ne '62784E1C4948202F0E3782380C2CF556724BC39BEE1E10E6D9807CDE89476E7E') { throw 'Candidate hash mismatch' }
          $stable = (Resolve-Path stable/Smart-Manage-Setup-1.0.31.exe).Path
          $destination = Join-Path $env:RUNNER_TEMP 'smartmanage-upgrade-validation'
          $evidence = @()
          $settingsDirectory = Join-Path $env:APPDATA 'Smart Manage'
          New-Item -ItemType Directory $settingsDirectory -Force | Out-Null
          $settings = Join-Path $settingsDirectory 'release-acceptance-synthetic.json'
          $settingsValue = '{"tenant":"synthetic-only","theme":"dark","selectedWorkspace":"isolated-workspace"}'
          [IO.File]::WriteAllText($settings,$settingsValue)
          foreach ($stage in @(@{name='fresh-stable';file=$stable;version='1.0.31'},@{name='upgrade';file=$candidate;version='1.0.32'},@{name='rollback-reinstall';file=$stable;version='1.0.31'},@{name='reinstall-after-rollback';file=$candidate;version='1.0.32'})) {
            $installArguments=@('/S')
            if($stage.name -eq 'fresh-stable'){$installArguments += "/D=$destination"}
            $process = Start-Process -FilePath $stage.file -ArgumentList $installArguments -Wait -PassThru -WindowStyle Hidden
            if ($process.ExitCode -ne 0) { throw "$($stage.name) installer failed: $($process.ExitCode)" }
            $actual = (Get-Item (Join-Path $destination 'Smart Manage.exe')).VersionInfo.ProductVersion
            if (-not $actual.StartsWith($stage.version)) { throw "$($stage.name) version mismatch: $actual" }
            $installedExe=Join-Path $destination 'Smart Manage.exe'
            $addresses=@('0.0.0.1-126.255.255.255','128.0.0.0-255.255.255.254','::2-ffff:ffff:ffff:ffff:ffff:ffff:ffff:fffe')
            $rule=New-NetFirewallRule -DisplayName "SmartManage recovery $([guid]::NewGuid())" -Direction Outbound -Program $installedExe -Action Block -RemoteAddress $addresses -ErrorAction Stop
            if($rule.Enabled -ne 'True' -or $rule.Action -ne 'Block'){throw 'Recovery outbound isolation inactive'}
            node scripts/windows-profile-recovery.mjs $installedExe $stage.name
            if($LASTEXITCODE -ne 0){throw 'Real installed profile recovery failed'}
            if (-not (Test-Path $settings) -or [IO.File]::ReadAllText($settings) -ne $settingsValue) { throw 'Synthetic user settings changed or deleted' }
            $shell = New-Object -ComObject WScript.Shell
            $shortcuts = Get-ChildItem (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs') -Recurse -Filter '*Smart Manage*.lnk'
            if (-not $shortcuts) { throw 'Installed Start Menu shortcut missing' }
            foreach($shortcut in $shortcuts) {
              $target=$shell.CreateShortcut($shortcut.FullName).TargetPath
              if ($target -ne (Join-Path $destination 'Smart Manage.exe')) { throw "Unexpected shortcut target: $target" }
            }
            $entries=Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like 'Smart Manage*' -and ([string]$_.UninstallString).Contains($destination) }
            if(-not $entries){throw 'Per-user uninstall registry entry missing for custom directory'}
            $globalEntries=Get-ItemProperty 'HKLM:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*','HKLM:\Software\WOW6432Node\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object { $_.DisplayName -like 'Smart Manage*' }
            if($globalEntries){throw 'Unexpected per-machine registration on clean runner'}
            $evidence += @{stage=$stage.name;installedVersion=$actual;exitCode=$process.ExitCode;syntheticSettingsPreserved=$true;shortcutTargetsValid=$true;perUserRegistry=$true;perMachineRegistry=$false}
          }
          $uninstaller=Get-ChildItem $destination -Filter 'Uninstall*.exe' | Select-Object -First 1
          if(-not $uninstaller){throw 'Candidate uninstaller missing'}
          $uninstall=Start-Process -FilePath $uninstaller.FullName -ArgumentList '/S' -Wait -PassThru -WindowStyle Hidden
          if($uninstall.ExitCode -ne 0){throw "Candidate uninstaller failed: $($uninstall.ExitCode)"}
          for($i=0;$i -lt 60 -and (Test-Path (Join-Path $destination 'Smart Manage.exe'));$i++){Start-Sleep 1}
          if(Test-Path (Join-Path $destination 'Smart Manage.exe')){throw 'Candidate executable remains after uninstall'}
          if([IO.File]::ReadAllText($settings) -ne $settingsValue){throw 'Uninstall deleted synthetic user data'}
          New-Item -ItemType Directory -Path evidence -Force | Out-Null
          @{stages=$evidence;appLaunch='PASS: isolated profile launches';automaticUpdate='PENDING OWNER VERIFICATION';candidateUninstall=$true;uninstallPreservesSyntheticSettings=$true;standardUserUAC='NOT TESTED: elevated CI runner';userDataRecovery='Profile localStorage retention and candidate theme consumption; encrypted session recovery NOT TESTED';candidateSha256=(Get-FileHash $candidate -Algorithm SHA256).Hash} | ConvertTo-Json -Depth 5 | Set-Content evidence/upgrade.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preserved-windows-upgrade-evidence
          path: evidence
          if-no-files-found: error
