name: Preserved Windows installer upgrade and rollback
on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/windows-preserved-upgrade.yml'
permissions:
  contents: read
  actions: read
jobs:
  upgrade:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: PackageReport-windows-exe
          run-id: 42035647291
          github-token: ${{ github.token }}
          path: candidate/dist-electron
      - name: Install stable, upgrade preserved binary, and restore stable
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          gh release download v1.0.31 --repo fso0c1ety/PackageReport --pattern Smart-Manage-Setup-1.0.31.exe --dir stable
          if ($LASTEXITCODE -ne 0) { throw 'Official stable download failed' }
          $candidate = (Resolve-Path candidate/dist-electron/Smart-Manage-Setup-1.0.32.exe).Path
          if ((Get-FileHash $candidate -Algorithm SHA256).Hash -ne '3166CDEB65BD323A2B561B41838F47ACE0E5FDDC4CCC0AB70E4DD268132D9362') { throw 'Candidate hash mismatch' }
          $stable = (Resolve-Path stable/Smart-Manage-Setup-1.0.31.exe).Path
          $destination = Join-Path $env:RUNNER_TEMP 'smartmanage-upgrade-validation'
          $evidence = @()
          $settingsDirectory = Join-Path $env:APPDATA 'Smart Manage'
          New-Item -ItemType Directory $settingsDirectory -Force | Out-Null
          $settings = Join-Path $settingsDirectory 'release-acceptance-synthetic.json'
          $settingsValue = '{"tenant":"synthetic-only","theme":"dark","selectedWorkspace":"isolated-workspace"}'
          [IO.File]::WriteAllText($settings,$settingsValue)
          foreach ($stage in @(@{name='fresh-stable';file=$stable;version='1.0.31'},@{name='upgrade';file=$candidate;version='1.0.32'},@{name='rollback-reinstall';file=$stable;version='1.0.31'})) {
            $process = Start-Process -FilePath $stage.file -ArgumentList @('/S',"/D=$destination") -Wait -PassThru -WindowStyle Hidden
            if ($process.ExitCode -ne 0) { throw "$($stage.name) installer failed: $($process.ExitCode)" }
            $actual = (Get-Item (Join-Path $destination 'Smart Manage.exe')).VersionInfo.ProductVersion
            if (-not $actual.StartsWith($stage.version)) { throw "$($stage.name) version mismatch: $actual" }
            if (-not (Test-Path $settings) -or [IO.File]::ReadAllText($settings) -ne $settingsValue) { throw 'Synthetic user settings changed or deleted' }
            $shell = New-Object -ComObject WScript.Shell
            $shortcuts = Get-ChildItem (Join-Path $env:APPDATA 'Microsoft\Windows\Start Menu\Programs') -Recurse -Filter '*Smart Manage*.lnk'
            if (-not $shortcuts) { throw 'Installed Start Menu shortcut missing' }
            foreach($shortcut in $shortcuts) {
              $target=$shell.CreateShortcut($shortcut.FullName).TargetPath
              if ($target -ne (Join-Path $destination 'Smart Manage.exe')) { throw "Unexpected shortcut target: $target" }
            }
            $evidence += @{stage=$stage.name;installedVersion=$actual;exitCode=$process.ExitCode;syntheticSettingsPreserved=$true;shortcutTargetsValid=$true}
          }
          New-Item -ItemType Directory -Path evidence -Force | Out-Null
          @{stages=$evidence;appLaunch='NOT TESTED';automaticUpdate='NOT TESTED';userDataRecovery='Synthetic settings file retention only; application consumption and encrypted session recovery NOT TESTED';candidateSha256=(Get-FileHash $candidate -Algorithm SHA256).Hash} | ConvertTo-Json -Depth 5 | Set-Content evidence/upgrade.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: preserved-windows-upgrade-evidence
          path: evidence
          if-no-files-found: error
