name: Existing schema compatibility
on:
  pull_request:
  push:
    branches: [fix/production-schema-compatibility-20261014]
permissions:
  contents: read
jobs:
  legacy-repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: isolated-test-only
          POSTGRES_DB: smart_manage_repair_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_manage_repair_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:isolated-test-only@127.0.0.1:5432/smart_manage_repair_test
      SMART_MANAGE_REPAIR_TEST: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: node --test test/schema-compatibility-postgres.test.js
