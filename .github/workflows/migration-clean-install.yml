name: PostgreSQL Clean Migration Install

on:
  pull_request:
    paths:
      - "server/db/migrations/**"
      - "server/db/runMigrations.js"
      - "server/db/migrationExecution.js"
      - "server/db/migrationUtils.js"
      - "scripts/vercel-build.js"
      - "test/migration-marketplace-postgres.integration.js"
      - ".github/workflows/migration-clean-install.yml"
      - ".github/workflows/portal-acceptance.yml"
      - ".github/workflows/quality.yml"

jobs:
  clean-install:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: smart_manage_migration_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: migration-ci-local-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d smart_manage_migration_test"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:migration-ci-local-only@127.0.0.1:5432/smart_manage_migration_test
      DATABASE_SSL: "false"
      SMART_MANAGE_MARKETPLACE_INTEGRATION: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify PostgreSQL 16 starts completely empty
        run: MIGRATION_TEST_PHASE=empty node --test test/migration-marketplace-postgres.integration.js
      - name: Run the complete migration chain on an empty database
        run: npm run db:migrate
      - name: Verify migration order and schema
        run: MIGRATION_TEST_PHASE=migrated node --test test/migrations.test.js test/migration-marketplace-postgres.integration.js
      - name: Rerun the complete migration chain
        run: npm run db:migrate
      - name: Verify existing database remains stable
        run: |
          node --input-type=commonjs <<'NODE'
          const { Client } = require('pg');
          const crypto = require('node:crypto');
          const fs = require('node:fs');
          (async () => {
            const c = new Client({ connectionString: process.env.DATABASE_URL, ssl: false });
            await c.connect();
            const rows = await c.query("SELECT filename, checksum FROM schema_migrations ORDER BY filename");
            const expected = new Map();
            for (const file of fs.readdirSync('server/db/migrations').filter((name) => name.endsWith('.sql')).sort()) {
              expected.set(file, crypto.createHash('sha256').update(fs.readFileSync(`server/db/migrations/${file}`)).digest('hex'));
            }
            if (rows.rowCount !== expected.size) throw new Error(`Expected ${expected.size} migrations, got ${rows.rowCount}`);
            for (const row of rows.rows) if (expected.get(row.filename) !== row.checksum) throw new Error(`Checksum mismatch: ${row.filename}`);
            const columns = await c.query("SELECT table_name FROM information_schema.tables WHERE table_schema='public' AND table_name IN ('marketplace_templates','marketplace_reviews','calendar_events') ORDER BY table_name");
            if (columns.rowCount !== 3) throw new Error(`Missing prerequisite tables: ${columns.rows.map((r) => r.table_name).join(',')}`);
            await c.end();
          })().catch((error) => { console.error(error); process.exit(1); });
          NODE
